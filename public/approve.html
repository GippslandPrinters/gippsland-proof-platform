<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proof Approval</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .job-info {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .job-info-item {
      margin-bottom: 12px;
    }

    .job-info-item:last-child {
      margin-bottom: 0;
    }

    .job-info-label {
      color: #666;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .job-info-value {
      color: #333;
      font-size: 16px;
      font-weight: 500;
    }

    .proof-preview {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }

    .proof-preview iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 4px;
    }

    .feedback-section {
      margin-bottom: 30px;
    }

    .feedback-section h3 {
      color: #333;
      margin-bottom: 12px;
      font-size: 16px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 100px;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .action-buttons {
        grid-template-columns: 1fr;
      }
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-approve {
      background: #28a745;
      color: white;
    }

    .btn-approve:hover {
      background: #218838;
    }

    .btn-approve:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .btn-reject {
      background: #dc3545;
      color: white;
    }

    .btn-reject:hover {
      background: #c82333;
    }

    .btn-reject:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Proof Approval Request</h1>
    <p class="subtitle">Please review the proof below and let us know if you approve or need changes</p>

    <div id="content" class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 20px; color: #666;">Loading proof...</p>
    </div>
  </div>

  <script>
    // Extract token from URL
    const token = window.location.pathname.split('/').pop();

    async function loadProof() {
      try {
        const response = await fetch(`/api/approve/${token}`);

        if (!response.ok) {
          showError('Proof not found or expired. Please check your link.');
          return;
        }

        const proof = await response.json();
        renderProof(proof);
      } catch (error) {
        showError(`Error loading proof: ${error.message}`);
      }
    }

    function renderProof(proof) {
      const content = document.getElementById('content');

      const html = `
        <div class="job-info">
          <div class="job-info-item">
            <div class="job-info-label">Job ID</div>
            <div class="job-info-value">${proof.jobId}</div>
          </div>
          <div class="job-info-item">
            <div class="job-info-label">Customer</div>
            <div class="job-info-value">${proof.customer}</div>
          </div>
          <div class="job-info-item">
            <div class="job-info-label">Description</div>
            <div class="job-info-value">${proof.description || 'N/A'}</div>
          </div>
        </div>

        <h3 style="color: #333; margin-bottom: 15px; font-size: 16px;">📄 Proof Preview</h3>
        <div class="proof-preview">
          <iframe src="/uploads/${proof.fileName}" type="application/pdf"></iframe>
        </div>

        <div class="feedback-section">
          <h3>💬 Additional Feedback (Optional)</h3>
          <p style="color: #666; font-size: 12px; margin-bottom: 10px;">If you need changes, please describe them below</p>
          <textarea id="feedback" placeholder="Enter any requested changes or feedback..."></textarea>
        </div>

        <div class="action-buttons">
          <button class="btn-approve" onclick="submitApproval('approve')">
            ✅ Approve This Proof
          </button>
          <button class="btn-reject" onclick="submitApproval('reject')">
            ❌ Request Changes
          </button>
        </div>

        <div id="message" class="message"></div>
      `;

      content.innerHTML = html;
    }

    async function submitApproval(action) {
      const feedback = document.getElementById('feedback')?.value || '';
      const buttons = document.querySelectorAll('.action-buttons button');

      // Disable buttons
      buttons.forEach(btn => btn.disabled = true);

      try {
        const response = await fetch(`/api/approve/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, feedback })
        });

        const data = await response.json();

        if (response.ok) {
          const message = action === 'approve'
            ? '✅ Thank you! Your approval has been recorded.'
            : '✅ Thank you! Your feedback has been recorded. Our team will review it shortly.';

          showMessage(message, 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          showMessage(`Error: ${data.error}`, 'error');
          buttons.forEach(btn => btn.disabled = false);
        }
      } catch (error) {
        showMessage(`Error submitting response: ${error.message}`, 'error');
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
    }

    function showError(text) {
      const content = document.getElementById('content');
      content.innerHTML = `<div class="message error" style="display: block;">${text}</div>`;
    }

    // Load proof on page load
    loadProof();
  </script>
</body>
</html>
